apis:
- name: Ekuaibao Open API
  description: >-
    The 合思开放平台 (Ekuaibao / HOSE Open Platform) REST API. 200+ documented operations
    across contacts, corporation, budgets, expense flows, forms, fee types, pay,
    payer info, checking bills, city and currency master data, data links, invoice
    extensions, dimensions, matrices, delegates and outbound-message webhooks.
    Auth is token-based (appKey/appSecurity exchanged for a short-lived accessToken;
    a v3 flow issues JWT tenant/platform tokens). The address prefix is resolved
    per tenant/platform via GET /api/openapi/v2/location.
