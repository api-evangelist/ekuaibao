aid: ekuaibao
name: Ekuaibao
description: >-
  Ekuaibao (合思 / HOSE, formerly 易快报) is a Chinese AI-powered spend-management and
  expense-control SaaS platform used by more than 7,000 enterprises. It unifies
  expense reimbursement, business-travel booking and management, corporate payment
  and settlement, invoice OCR and validation, budget control, BI analytics and
  electronic accounting archiving. The company operates the 合思开放平台 (Ekuaibao Open
  Platform), a substantial REST API of 200+ documented operations across two dozen
  modules — contacts, corporation, budgets, expense flows, forms, fee types, pay
  and payer info, city and currency master data, data links, matrices, delegates
  and outbound-message webhooks — letting external systems (OA, ERP, HR, travel)
  synchronize staff, departments, budgets, documents, invoices and approvals.
  Access is token-based: an appKey/appSecurity pair is exchanged for a
  short-lived accessToken (v1) or a JWT-based tenant/platform token (v3).
